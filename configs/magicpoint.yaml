dataset:
  train_dir: "data/tfrecords/synthetic_shapes/train"
  valid_dir: "data/tfrecords/synthetic_shapes/valid"
  total_shards: 7


training:
  batch_size: 2
  epochs: 1
  steps_per_epoch: 450    # when batch_size = 32
  learning_rate: 0.001


model:
  input_channels: 1
  mean: 0.5
  variance: 0.25


runtime:
  seed: 42
  deterministic: true


logging:
  root_dir: "runs/magicpoint"
  experiment_name: "exp_001"


checkpointing:
  save_last: true
  last_name: "last"
  save_best: true
  best_name: "best"
  monitor: "val_loss"
  mode: "min"
  state_file: "train_state.json"
  
